<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/ico" href="static/favicon.ico" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="{{ url_for('static', filename='js/socket.io.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/navigation.js') }}"></script>
    <title>Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        /* Grid Background Effect */
        body::before {
            content: "";
            position: absolute;
            width: 300%;
            height: 200%;
            background-image: 
                linear-gradient(rgba(0, 255, 157, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 157, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            transform: translate(-25%, -25%) rotate(15deg);
            z-index: 1;
            pointer-events: none; 
        }
        h1 {
            font-size: 2.5rem;
            text-shadow: 0 0 10px #0ff, 0 0 20px #0ff, 0 0 40px #0ff;
            margin-bottom: 20px;
        }
        form {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 2em;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 255, 157, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: relative;
            z-index: 2;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            font-size: 1em;
            border: 1px solid rgba(0, 255, 255, 0.5);
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #0ff;
            box-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
            outline: none;
        }
        button {
            padding: 12px 20px;
            font-size: 1em;
            cursor: pointer;
            background: rgba(0, 255, 255, 0.2);
            color: #fff;
            border: 1px solid #0ff;
            border-radius: 5px;
            width: 100%;
            margin-top: 10px;
            transition: all 0.3s ease;
            text-shadow: 0 0 5px #0ff, 0 0 10px #0ff;
        }
        button:hover {
            background: rgba(0, 255, 255, 0.5);
            box-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
        }
        a {
            display: inline-block;
            margin-top: 15px;
            color: #0ff;
            font-weight: bold;
            transition: color 0.3s ease;
        }
        a:hover {
            color: #0ff;
            text-shadow: 0 0 5px #0ff, 0 0 10px #0ff;
        }
        #video-stream {
            padding: 10px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 255, 255, 0.2);
            width: 100%;
            max-width: 820px; /* Updated max-width for 75% size */
            margin: 20px auto; /* Center horizontally */
            text-align: center; /* Center text/content within */
            z-index: 2;

        }
        
        #live-video {
            width: 100%; /* Maintain responsive width */
            height: auto;
            border: 3px solid #0ff;
            border-radius: 8px;
            background: #000;
            aspect-ratio: 4 / 3; /* Maintain aspect ratio */
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }
            body {
                height: auto;
                min-height: 100vh;
                padding: 20px;
            }
            form {
                padding: 1.5em;
            }
        }
    </style>
</head>
<body>
    {% if is_mobile %}
    <div>
        <h1>Register</h1>
        <form id="registration-form" method="POST" action="{{ url_for('register') }}">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="pin" placeholder="PIN" required>
            <button type="submit">Register</button>
        </form>
        <a href="#" onclick="navigateTo('/login')">Already registered? Login here!</a> 
        <a href="#" onclick="navigateTo('/')">Go back to the Homepage</a>
    </div>
    <script>
        const socket = io('/registration');

        document.getElementById('registration-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.querySelector('input[name="username"]').value;
            const pin = document.querySelector('input[name="pin"]').value;

            // Emit registration start event
            socket.emit('start_registration', { username: username, pin: pin });

            // Submit the form after notifying the host
            this.submit();
        });
    </script>
    {% endif %}

    {% if not is_mobile %}
    <div id="video-stream">
        <h2>Live Recognition Preview</h2>
        <img src="{{ url_for('video_feed') }}" id="live-video" alt="Live video stream">
    </div>
    {% endif %}
</body>
</html>
