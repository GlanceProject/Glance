<!-- templates/login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/ico" href="static/favicon.ico" />
    <meta charset="UTF-8">
    <script src="{{ url_for('static', filename='js/socket.io.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/navigation.js') }}"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500&display=swap" rel="stylesheet">

    <style>
        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Grid Background Effect */
        body::before {
            content: "";
            position: absolute;
            width: 300%;
            height: 200%;
            background-image: 
                linear-gradient(rgba(0, 255, 157, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 157, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            transform: translate(-25%, -25%) rotate(15deg);
            z-index: 1;
            pointer-events: none; 
        }

        h1 {
            font-size: 2.5rem;
            text-shadow: 0 0 10px #0ff, 0 0 20px #0ff, 0 0 40px #0ff;
            margin-bottom: 20px;
            {% if not is_mobile%}
            font-size: 4rem;
            text-align: center;
            {% endif %}
        }

        form {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 2em;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 255, 157, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        label {
            display: block;
            font-weight: bold;
            text-align: left;
            margin: 10px 0 5px;
            color: #0ff;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            font-size: 1em;
            border: 1px solid rgba(0, 255, 255, 0.5);
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #0ff;
            box-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
            outline: none;
        }

        button {
            padding: 12px 20px;
            font-size: 1em;
            cursor: pointer;
            background: rgba(0, 255, 255, 0.2);
            color: #fff;
            border: 1px solid #0ff;
            border-radius: 5px;
            width: 100%;
            margin-top: 10px;
            transition: all 0.3s ease;
            text-shadow: 0 0 5px #0ff, 0 0 10px #0ff;
        }

        button:hover {
            background: rgba(0, 255, 255, 0.5);
            box-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
        }

        a {
            display: inline-block;
            margin-top: 15px;
            color: #0ff;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        a:hover {
            color: #0ff;
            text-shadow: 0 0 5px #0ff, 0 0 10px #0ff;
        }

        .flash-message {
            background: rgba(0, 0, 0, 0.6);
            color: #0ff;
            border: 1px solid rgba(0, 255, 255, 0.5);
            border-radius: 5px;
            padding: 10px;
            margin: 20px 0;
            font-size: 0.9em;
            display: none;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }
            body {
                height: auto;
                min-height: 100vh;
                padding: 20px;
            }
            form {
                padding: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div>
        <h1>Login</h1>
        <div id="face-recognition-message" style="display:;">
            <p>Face recognition failed. Please enter your PIN.</p>
        </div>
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="flash-message" style="display: block;">
            {% for message in messages %}
            <p>{{ message }}</p>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}
        {% if is_mobile %}
        <form method="POST">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required placeholder="Enter your username">
            <label for="pin">PIN (if face recognition fails):</label>
            <input type="password" id="pin" name="pin" placeholder="Enter your PIN">
            <button type="submit">Login</button>
        </form>
        <a href="#" onclick="navigateTo('/register')">Not registered? Register here!</a>
        <a href="#" onclick="navigateTo('/')">Go back to the Homepage</a>
        {% endif %}
    </div>
    <script>
        const isMobile = /Mobi/i.test(navigator.userAgent);
        // Initialize navigation state
        window.addEventListener('DOMContentLoaded', () => {
            if(!window.location.pathname.includes('/dashboard/optimization')) {
                socket.emit('page_loaded', {
                    path: window.location.pathname,
                    isMobile: {% if is_mobile %}true{% else %}false{% endif %}
                });
            }
        });
    </script>
</body>
</html>
